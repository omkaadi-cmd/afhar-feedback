<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أثر | التغذية الراجعة الذكية</title>
<style>
:root{
  --primary:#7355a6;
  --primary-2:#5f468e;
  --soft:#ece7f3;
  --bg:#f7f4fb;
  --text:#282433;
  --muted:#71697a;
  --border:#e6deec;
  --ok:#e8f6ec;
  --bad:#fff0f0;
  --warn:#fff3cd;
}
*{box-sizing:border-box}
body{
  font-family:Arial,Tahoma,sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
header{
  background:#fff;
  border-bottom:1px solid #e7e1ef;
  padding:24px 18px;
}
.wrap{max-width:950px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:58px;height:58px;border-radius:17px;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;
  font-size:23px;font-weight:700
}
h1,h2,h3{margin-top:0}
.sub{color:#6d6675;margin-top:5px}
.card{
  background:#fff;
  margin:24px auto;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}
button{
  border:0;border-radius:12px;
  padding:13px 18px;font-size:16px;
  cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.primary:hover{background:var(--primary-2)}
.secondary{background:var(--soft);color:#342c44}
.danger{background:#f8dddd;color:#7c2929}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
input,textarea,select{
  width:100%;padding:12px;margin:7px 0 14px;
  border:1px solid #d8d0e2;border-radius:10px;
  font-size:16px;background:#fff
}
label{font-weight:700}
.question{
  border:1px solid var(--border);
  border-radius:14px;padding:16px;margin:14px 0
}
.option{
  display:flex;align-items:center;gap:8px;
  padding:9px;margin:7px 0;
  border:1px solid #eee;border-radius:10px;
  font-weight:400
}
.option input{width:auto;margin:0}
.success{background:var(--ok);padding:14px;border-radius:12px}
.notice{background:var(--warn);padding:12px;border-radius:10px}
.good{background:#edf8ef;padding:12px;border-radius:10px;margin:10px 0}
.bad{background:var(--bad);padding:12px;border-radius:10px;margin:10px 0}
.score{font-size:52px;font-weight:800;color:var(--primary)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{
  border:1px solid var(--border);
  border-radius:16px;padding:18px;text-align:center
}
.stat .n{font-size:38px;font-weight:800;color:var(--primary);margin-top:8px}
footer{text-align:center;padding:28px 18px;color:#6d6675}
.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  h1{font-size:24px}
  .score{font-size:44px}
}
</style>
</head>
<body>

  <div class="wrap brand">
    <div class="logo">أثر</div>

      <h1>التغذية الراجعة الذكية</h1>

<main id="app" class="wrap"></main>

<footer>

  •
  المتوسطة التاسعة عشر والابتدائية السابعة والثلاثون
</footer>

<script>
const app = document.getElementById("app");
const ADMIN_KEY = "Athar@2026";

const SUPABASE_URL = "https://oefnaijupxprbscgzoxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_C8SkTQOWvL4ghK-7UlTSTQ_mmY1e8xM";

const params = new URLSearchParams(location.search);
 const quizData = params.get("data") || new URLSearchParams(location.hash.slice(1)).get("data");

function encodeQuiz(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

function decodeQuiz(str){
  str = str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length % 4) str += "=";
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function val(id){
  return document.getElementById(id)?.value.trim() || "";
}

function getQuizzes(){
  try{
    return JSON.parse(localStorage.getItem("atharQuizzes") || "[]");
  }catch{
    return [];
  }
}

function saveQuizzes(arr){
  localStorage.setItem("atharQuizzes", JSON.stringify(arr));
}

async function atharRpc(name, payload = {}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY
    },
    body:JSON.stringify(payload)
  });

  if(!res.ok){
    throw new Error("تعذر الاتصال بقاعدة البيانات");
  }

  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function trackVisit(quiz){
    atharRpc("athar_log_visit", {
    p_quiz_title: quiz.title || "اختبار"
  }).catch(()=>{});
}

function trackResult(quiz, correct, wrong, percent, level){
  atharRpc("athar_log_result", {
    p_quiz_title: quiz.title || "اختبار",
    p_correct_count: correct,
    p_wrong_count: wrong,
    p_percent: percent,
    p_level: level
  }).catch(()=>{});
}

function home(){
  app.innerHTML = `
    <section class="card">
      <h2>مرحبًا بك في منصة أثر 💜</h2>
      <p>
        منصة تعليمية للتغذية الراجعة الفورية تساعد الطالبة
        على معرفة مستوى أدائها وتصحيح أخطائها مباشرة.
      </p>

      <div class="actions">
        <button class="primary" id="studentBtn">
          دخول الطالبة
        </button>

        <button class="secondary" id="teacherBtn">
          دخول المعلمة
        </button>
      </div>
    </section>
  `;

  document.getElementById("studentBtn").onclick = ()=>{
    app.innerHTML = `
      <section class="card">
        <h2>رابط الاختبار</h2>
        <div class="notice">
          افتحي رابط الاختبار الذي أرسلته لك المعلمة.
        </div>
        <div class="actions">
          <button class="secondary" onclick="home()">رجوع</button>
        </div>

    `;
  };

  document.getElementById("teacherBtn").onclick = teacherLogin;
}

function teacherLogin(){
  app.innerHTML = `
    <section class="card">
      <h2>دخول المعلمة</h2>

      <label>رمز الدخول</label>
      <input id="teacherCode" type="password"
             placeholder="أدخلي رمز الدخول">

      <div id="loginMsg"></div>

      <div class="actions">

        <button class="secondary" onclick="home()">رجوع</button>
      </div>
    </section>
  `;

  document.getElementById("loginBtn").onclick = ()=>{
    if(val("teacherCode") !== ADMIN_KEY){
      document.getElementById("loginMsg").innerHTML =
        `<div class="bad">رمز الدخول غير صحيح</div>`;
      return;

    teacherDashboard();
  };
}

function teacherDashboard(){
  const quizzes = getQuizzes();

  app.innerHTML = `
    <section class="card">
      <h2>لوحة المعلمة</h2>
      <p class="muted">معلمة المادة: مريم الظفيري</p>

      <div class="actions">
        <button class="primary" id="newQuizBtn">
          ➕ إنشاء اختبار جديد
        </button>

        <button class="secondary" id="statsBtn">
          📊 الإحصائيات
        </button>
      </div>
    </section>

    <section class="card">
      <h3>اختباراتي</h3>

      ${
        quizzes.length
        ?
        quizzes.map((q,i)=>`
          <div class="question">
            <strong>${esc(q.title)}</strong>
            <div class="small">
              عدد الأسئلة: ${q.questions.length}
            </div>

            <div class="actions">
              <button class="secondary"
                      onclick="copyQuizLink(${i})">
                🔗 نسخ رابط الاختبار
              </button>

              <button class="danger"
                      onclick="deleteQuiz(${i})">
                حذف
              </button>
            </div>
          </div>
        `).join("")
        :
        `<p class="muted">لا توجد اختبارات محفوظة حتى الآن.</p>`
      }
    </section>
  `;

  document.getElementById("newQuizBtn").onclick = createQuizForm;
  document.getElementById("statsBtn").onclick = showAnalytics;
}

function deleteQuiz(i){
  if(!confirm("هل تريدين حذف هذا الاختبار؟")) return;

  const arr = getQuizzes();
  arr.splice(i,1);
  saveQuizzes(arr);
  teacherDashboard();
}

function copyQuizLink(i){
  const quiz = getQuizzes()[i];
  const link =
    location.origin +
    location.pathname +
    "#data=" +
    encodeQuiz(quiz);

  if(navigator.clipboard){
    navigator.clipboard.writeText(link)
      .then(()=>alert("تم نسخ رابط الاختبار ✅"))
      .catch(()=>prompt("انسخي الرابط:",link));
  }else{
    prompt("انسخي الرابط:",link);
  }
}

        <div class="grid">
          <div class="stat">

          </div>

          <div class="stat">

            <div class="n">${Number(data?.completed || 0)}</div>
          </div>

          <div class="stat">
            <div>الطالبات المتفوقات</div>
            <div class="n">${Number(data?.excellent || 0)}</div>
          </div>

          <div class="stat">
            <div>متوسط النتائج</div>
            <div class="n">${Number(data?.average || 0)}%</div>
          </div>

          <div class="stat">

          </div>

          <div class="stat">

          </div>
        </div>

        <p class="small">
          ملاحظة: عدد مرات الدخول يحسب فتح رابط الاختبار،
          وقد يتكرر إذا أعادت الطالبة فتح الصفحة.
        </p>

        <div class="actions">
          <button class="secondary" onclick="teacherDashboard()">

  }catch(e){

      <section class="card">
        <h2>الإحصائيات</h2>
        <div class="bad">
          تعذر تحميل الإحصائيات الآن.
        </div>
        <div class="actions">
          <button class="secondary" onclick="teacherDashboard()">

function createQuizForm(){
    app.innerHTML = `
    <section class="card">
      <h2>إنشاء اختبار جديد</h2>

      <label>عنوان الاختبار</label>
      <input id="quizTitle" placeholder="مثال: الدولة العباسية">

      <label>المادة</label>
      <input id="subject" value="الدراسات الاجتماعية">

      <label>نسبة التفوق التي تستحق عندها الطالبة الشهادة</label>
      <select id="excellentAt">
        <option value="90">90% فأكثر</option>
        <option value="85">85% فأكثر</option>
        <option value="80">80% فأكثر</option>
      </select>

      <label>عدد الأسئلة</label>
      <select id="questionCount">
        <option value="3">3 أسئلة</option>
        <option value="5" selected>5 أسئلة</option>
        <option value="10">10 أسئلة</option>
      </select>

      <div class="actions">
        <button class="primary" id="continueQuizBtn">
          متابعة وإدخال الأسئلة
        </button>

        <button class="secondary" onclick="teacherDashboard()">
          رجوع
        </button>
      </div>
    </section>
  `;

  document.getElementById("continueQuizBtn").onclick = ()=>{
    const title = val("quizTitle");
    const subject = val("subject");
    const excellentAt =
      Number(document.getElementById("excellentAt").value);
    const count =
      Number(document.getElementById("questionCount").value);

    if(!title){
      alert("اكتبي عنوان الاختبار");
      return;
    }

    questionsForm({
      title,
      subject,
      excellentAt,
      count
    });
  };
}

function questionsForm(info){
  let blocks = "";

  for(let i=0;i<info.count;i++){
    blocks += `
      <div class="question">
        <h3>السؤال ${i+1}</h3>

        <label>نص السؤال</label>
        <input id="q${i}"
               placeholder="اكتبي السؤال هنا">

        <label>الخيار الأول</label>
        <input id="q${i}a"
               placeholder="الخيار الأول">

        <label>الخيار الثاني</label>
        <input id="q${i}b"
               placeholder="الخيار الثاني">

        <label>الخيار الثالث</label>
        <input id="q${i}c"
               placeholder="الخيار الثالث">

        <label>الخيار الرابع</label>
        <input id="q${i}d"
               placeholder="الخيار الرابع">

        <label>الإجابة الصحيحة</label>
        <select id="q${i}correct">
          <option value="0">الخيار الأول</option>
          <option value="1">الخيار الثاني</option>
          <option value="2">الخيار الثالث</option>
          <option value="3">الخيار الرابع</option>
        </select>

        <label>التغذية الراجعة عند الخطأ</label>
        <textarea id="q${i}feedback"
          placeholder="مثال: راجعي الفقرة الخاصة بهذا المفهوم في الدرس."></textarea>
      </div>
    `;
  }

  app.innerHTML = `
    <section class="card">
      <h2>${esc(info.title)}</h2>
      <p class="muted">${esc(info.subject)}</p>

      ${blocks}

      <div class="actions">
        <button class="primary" id="saveQuizBtn">
          حفظ وإنشاء الرابط
        </button>

        <button class="secondary" onclick="createQuizForm()">
          رجوع
        </button>
      </div>
    </section>
  `;

  document.getElementById("saveQuizBtn").onclick = ()=>{
    const questions = [];

    for(let i=0;i<info.count;i++){
      const question = val(`q${i}`);
      const options = [
        val(`q${i}a`),
        val(`q${i}b`),
        val(`q${i}c`),
        val(`q${i}d`)
      ];

      const correct =
        Number(document.getElementById(`q${i}correct`).value);

      const feedback = val(`q${i}feedback`);

      if(!question || options.some(x=>!x)){
        alert(`أكملي بيانات السؤال ${i+1}`);
        return;
      }

      questions.push({
        question,
        options,
        correct,
        feedback
      });
    }

    const quiz = {
      title:info.title,
      subject:info.subject,
      excellentAt:info.excellentAt,
      questions
    };

    const arr = getQuizzes();
    arr.unshift(quiz);
    saveQuizzes(arr);

    const link =
      location.origin +
      location.pathname +
      "#data=" +
      encodeQuiz(quiz);

    app.innerHTML = `
      <section class="card">
        <h2>تم إنشاء الاختبار بنجاح ✅</h2>

        <div class="success">
          أصبح رابط الاختبار جاهزًا للإرسال للطالبات.
        </div>

        <label>رابط الاختبار</label>
        <textarea id="quizLink" readonly>${esc(link)}</textarea>

        <div class="actions">
          <button class="primary" id="copyCreatedLink">
            🔗 نسخ الرابط
          </button>

          <button class="secondary" onclick="teacherDashboard()">
            العودة للوحة المعلمة
          </button>
        </div>
      </section>
    `;

    document.getElementById("copyCreatedLink").onclick = ()=>{
      if(navigator.clipboard){
        navigator.clipboard.writeText(link)
          .then(()=>alert("تم نسخ الرابط ✅"))
          .catch(()=>prompt("انسخي الرابط:",link));
      }else{
        prompt("انسخي الرابط:",link);
      }
    };
  };
}

function studentQuiz(quiz){
    trackVisit(quiz);

  app.innerHTML = `
    <section class="card">
      <h2>${esc(quiz.title)}</h2>
      <p class="muted">${esc(quiz.subject || "الدراسات الاجتماعية")}</p>

      <div class="notice">
        اكتبي بياناتك أولًا، ثم أجيبي عن جميع الأسئلة.
      </div>

      <label>اسم الطالبة</label>
      <input id="studentName" placeholder="اكتبي اسمك">

      <label>الصف / الفصل</label>
      <input id="studentClass" placeholder="مثال: ثالث متوسط / أ">

      <div id="studentMsg"></div>

      ${quiz.questions.map((q,i)=>`
        <div class="question">
          <h3>${i+1}. ${esc(q.question)}</h3>

          ${q.options.map((op,j)=>`
            <label class="option">
              <input type="radio"
                     name="question${i}"
                     value="${j}">
              <span>${esc(op)}</span>
            </label>
          `).join("")}
        </div>
      `).join("")}

      <div class="actions">
        <button class="primary" id="submitQuizBtn">
          إرسال الإجابات
        </button>
      </div>
    </section>
  `;

  document.getElementById("submitQuizBtn").onclick = ()=>{
    gradeQuiz(quiz);
  };
}

function gradeQuiz(quiz){
  const studentName = val("studentName");
  const studentClass = val("studentClass");

  if(!studentName){
    document.getElementById("studentMsg").innerHTML =
      `<div class="bad">اكتبي اسم الطالبة أولًا.</div>`;
    return;
  }

  if(!studentClass){
    document.getElementById("studentMsg").innerHTML =
      `<div class="bad">اكتبي الصف أو الفصل أولًا.</div>`;
    return;
  }

  let correct = 0;
  let wrong = 0;
  const feedback = [];

  for(let i=0;i<quiz.questions.length;i++){
    const q = quiz.questions[i];

    const selected =
      document.querySelector(
        `input[name="question${i}"]:checked`
      );

    if(!selected){
      document.getElementById("studentMsg").innerHTML =
        `<div class="bad">
          أجيبي عن جميع الأسئلة قبل إرسال الاختبار.
        </div>`;
      return;
    }

    const answer = Number(selected.value);
    const ok = answer === Number(q.correct);

    if(ok){
      correct++;
    }else{
      wrong++;
    }

    feedback.push({
      question:q.question,
      ok,
      correctText:q.options[q.correct],
      feedback:q.feedback || "راجعي هذا الجزء من الدرس."
    });
  }

  const percent =
    Math.round((correct / quiz.questions.length) * 100);

  let level = "";

  if(percent >= Number(quiz.excellentAt || 90)){
    level = "متفوقة";
  }else if(percent >= 80){
    level = "متقنة";
  }else if(percent >= 60){
    level = "جيدة";
  }else{
    level = "تحتاج مراجعة";
  }

  trackResult(
    quiz,
    correct,
    wrong,
    percent,
    level
  );

  const feedbackHtml = feedback.map((f,i)=>`
    <div class="${f.ok ? "good" : "bad"}">
      <strong>
        ${i+1}. ${esc(f.question)}
      </strong>

      <p>
        ${
          f.ok
          ? "✓ إجابة صحيحة"
          : "✕ الإجابة الصحيحة: " + esc(f.correctText)
        }
      </p>

      ${
        f.ok
        ? ""
        : `<p><strong>التغذية الراجعة:</strong>
             ${esc(f.feedback)}
           </p>`
      }
    </div>
  `).join("");

  app.innerHTML = `
    <section class="card">
      <h2>نتيجة الطالبة</h2>

      <p>
        <strong>${esc(studentName)}</strong>
        •
        ${esc(studentClass)}
      </p>

      <div class="score">${percent}%</div>

      <h3>${esc(level)}</h3>

      <div class="grid">
        <div class="stat">
          <div>الإجابات الصحيحة</div>
          <div class="n">${correct}</div>
        </div>

        <div class="stat">
          <div>الإجابات الخاطئة</div>
          <div class="n">${wrong}</div>
        </div>
      </div>

      <h3 style="margin-top:24px">
        التغذية الراجعة
      </h3>

      ${feedbackHtml}

      <div id="awardButtons"></div>
    </section>
  `;

  const box = document.getElementById("awardButtons");

  if(percent >= Number(quiz.excellentAt || 90)){
    box.innerHTML = `
      <div class="success" style="margin-top:20px">
        🎉 أحسنتِ! تستحقين شهادة التفوق.
      </div>

      <div class="actions">
        <button class="primary" id="certBtn">
          🎓 شهادة التفوق
        </button>

        <button class="secondary" id="parentBtn">
          💜 شكر ولي الأمر
        </button>
      </div>
    `;

    const cert = ()=>{
      makeAward(
        "شهادة تفوق",
        `تُمنح للطالبة ${studentName}
تقديرًا لتفوقها وتميزها في ${quiz.title}
وحصولها على نسبة ${percent}%
مع أطيب الأمنيات لها بمزيد من النجاح والتفوق.`,
        `شهادة_التفوق_${studentName}.png`
      );
    };

    document.getElementById("certBtn").onclick = cert;

    document.getElementById("parentBtn").onclick = ()=>{
      makeAward(
        "شكر وتقدير لولي الأمر",
        `نتقدم بخالص الشكر والتقدير لولي أمر الطالبة
${studentName}
على المتابعة والدعم المستمر،
والذي أسهم في تميزها وتفوقها.
شكرًا لشراكتكم في صناعة النجاح.`,
        `شكر_ولي_الأمر_${studentName}.png`
      );
    };

    setTimeout(cert,150);
  }
}

function makeAward(title,text,fileName){
    const canvas = document.createElement("canvas");
  canvas.width = 1600;
  canvas.height = 1100;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "#7355a6";
  ctx.lineWidth = 16;
  ctx.strokeRect(45,45,1510,1010);

  ctx.strokeStyle = "#c5a55a";
  ctx.lineWidth = 5;
  ctx.strokeRect(75,75,1450,950);

  ctx.textAlign = "center";
  ctx.direction = "rtl";

  ctx.fillStyle = "#7355a6";
  ctx.font = "bold 72px Arial";
  ctx.fillText("أثر | التغذية الراجعة الذكية",800,180);

  ctx.fillStyle = "#c5a55a";
  ctx.font = "bold 68px Arial";
  ctx.fillText(title,800,310);

  ctx.fillStyle = "#282433";
  ctx.font = "42px Arial";

  const lines = String(text).split("\n");
  let y = 430;

  lines.forEach(line=>{
    ctx.fillText(line,800,y);
    y += 75;
  });

  ctx.fillStyle = "#7355a6";
  ctx.font = "bold 34px Arial";
  ctx.fillText("معلمة المادة: مريم الظفيري",800,900);

  ctx.fillStyle = "#282433";
  ctx.font = "30px Arial";
  ctx.fillText(
    "المتوسطة التاسعة عشر والابتدائية السابعة والثلاثون",
    800,
    960
  );

  const link = document.createElement("a");
  link.download = fileName;
  link.href = canvas.toDataURL("image/png");
  document.body.appendChild(link);
  link.click();
  link.remove();
}
