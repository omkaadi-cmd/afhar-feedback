<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أثر | التغذية الراجعة الذكية</title>

<style>
body{
  font-family:Arial,Tahoma,sans-serif;
  margin:0;
  background:#f7f4fb;
  color:#282433;
}
header{
  background:#fff;
  border-bottom:1px solid #e7e1ef;
  padding:24px 18px;
}
.wrap{
  max-width:900px;
  margin:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#7355a6;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:700;
}
h1{
  margin:0;
}
.sub{
  color:#6d6675;
  margin-top:5px;
}
.card{
  background:#fff;
  margin:24px auto;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}
button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  cursor:pointer;
}
.primary{
  background:#7355a6;
  color:#fff;
}
.secondary{
  background:#ece7f3;
  color:#342c44;
}
.danger{
  background:#f8dddd;
  color:#7c2929;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #d8d0e2;
  border-radius:10px;
  font-size:16px;
}
label{
  font-weight:700;
}
.question{
  border:1px solid #e6deec;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
}
.option{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  margin:7px 0;
  border:1px solid #eee;
  border-radius:10px;
  font-weight:400;
}
.option input{
  width:auto;
  margin:0;
}
.success{
  background:#e8f6ec;
  padding:14px;
  border-radius:12px;
}
.notice{
  background:#fff3cd;
  padding:12px;
  border-radius:10px;
}
.good{
  background:#edf8ef;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}
.bad{
  background:#fff0f0;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}
.score{
  font-size:56px;
  font-weight:800;
  color:#7355a6;
}
.muted{
  color:#71697a;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
footer{
  text-align:center;
  padding:28px 18px;
  color:#6d6675;
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  h1{font-size:24px}
}
</style>
</head>

<body>

<header>
  <div class="wrap brand">
    <div class="logo">أثر</div>
    <div>
      <h1>التغذية الراجعة الذكية</h1>
      <div class="sub">تعلم • تصحيح • تحسين</div>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  معلمة المادة: مريم الظفيري
  •
  المتوسطة التاسعة عشر والابتدائية السابعة والثلاثون
</footer>

<script>
const app = document.getElementById("app");
const ADMIN_KEY = "Athar@2026";

const params = new URLSearchParams(location.search);
const quizData = params.get("data");

function encodeQuiz(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

function decodeQuiz(str){
  str = str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length % 4) str += "=";
  return JSON.parse(
    decodeURIComponent(
      escape(atob(str))
    )
  );
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function val(id){
  return document.getElementById(id)?.value.trim() || "";
}

function getQuizzes(){
  try{
    return JSON.parse(localStorage.getItem("atharQuizzes") || "[]");
  }catch{
    return [];
  }
}

function saveQuizzes(arr){
  localStorage.setItem("atharQuizzes", JSON.stringify(arr));
}

function home(){
  app.innerHTML = `
    <section class="card">
      <h2>تغذية راجعة فورية تصنع فرقًا</h2>
      <p>
        تنشئ المعلمة الأسئلة، ثم ترسل رابطًا للطالبة،
        وبعد الحل تظهر النتيجة والتغذية الراجعة مباشرة.
      </p>

      <div class="actions">
        <button class="primary" id="teacherBtn">دخول المعلمة</button>
        <button class="secondary" id="studentBtn">دخول الطالبة</button>
      </div>
    </section>
  `;

  document.getElementById("teacherBtn").onclick = teacherLogin;

  document.getElementById("studentBtn").onclick = () => {
    app.innerHTML = `
      <section class="card">
        <h2>دخول الطالبة</h2>
        <p class="muted">
          افتحي رابط الاختبار الذي أرسلته المعلمة.
          كل اختبار له رابط خاص.
        </p>
        <button class="secondary" onclick="home()">عودة</button>
      </section>
    `;
  };
}

function teacherLogin(){
  app.innerHTML = `
    <section class="card">
      <h2>دخول المعلمة</h2>

      <label>رمز الدخول</label>
      <input id="adminKey" type="password" placeholder="رمز المعلمة">

      <div class="actions">
        <button class="primary" id="loginBtn">دخول</button>
        <button class="secondary" onclick="home()">عودة</button>
      </div>

      <div id="loginMsg"></div>
    </section>
  `;

  document.getElementById("loginBtn").onclick = () => {
    if(val("adminKey") !== ADMIN_KEY){
      document.getElementById("loginMsg").innerHTML =
        '<p class="notice">رمز الدخول غير صحيح.</p>';
      return;
    }

    teacherDashboard();
  };
}

function teacherDashboard(){
  const quizzes = getQuizzes();

  app.innerHTML = `
    <section class="card">
      <div class="actions">
        <button class="primary" id="newQuizBtn">+ اختبار جديد</button>
      </div>

      <h2>اختبارات التغذية الراجعة</h2>

      <div id="quizList"></div>
    </section>
  `;

  const list = document.getElementById("quizList");

  if(!quizzes.length){
    list.innerHTML = '<p class="muted">لا توجد اختبارات بعد.</p>';
  }else{
    list.innerHTML = quizzes.map((q,i) => `
      <div class="question">
        <h3>${esc(q.title)}</h3>
        <p class="muted">
          ${esc(q.subject || "")}
          •
          ${q.questions.length} سؤال
        </p>

        <div class="actions">
          <button class="secondary" onclick="copyQuizLink(${i})">
            نسخ رابط الطالبات
          </button>

          <button class="danger" onclick="deleteQuiz(${i})">
            حذف
          </button>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("newQuizBtn").onclick = createQuizForm;
}

function createQuizForm(){
  app.innerHTML = `
    <section class="card">
      <h2>إنشاء اختبار جديد</h2>

      <label>عنوان الاختبار</label>
      <input id="quizTitle" placeholder="مثال: الدولة العباسية">

      <label>المادة</label>
      <input id="quizSubject" value="الدراسات الاجتماعية">

      <label>الصف / الفصل</label>
      <input id="quizGrade" placeholder="مثال: ثاني متوسط">

      <label>نسبة التفوق</label>
      <input id="excellentAt" type="number" value="90" min="1" max="100">

      <div id="questions"></div>

      <div class="actions">
        <button class="secondary" id="addQuestionBtn">
          + إضافة سؤال
        </button>

        <button class="primary" id="saveQuizBtn">
          حفظ وإنشاء الرابط
        </button>

        <button class="secondary" onclick="teacherDashboard()">
          عودة
        </button>
      </div>

      <div id="saveMsg"></div>
    </section>
  `;

  document.getElementById("addQuestionBtn").onclick = addQuestion;
  document.getElementById("saveQuizBtn").onclick = saveQuiz;

  addQuestion();
  addQuestion();
  addQuestion();
}

function addQuestion(){
  const box = document.createElement("div");
  box.className = "question qedit";

  box.innerHTML = `
    <label>نص السؤال</label>
    <input class="qtext" placeholder="اكتبي السؤال">

    <div class="grid">
      <input class="optionInput" placeholder="الخيار الأول">
      <input class="optionInput" placeholder="الخيار الثاني">
      <input class="optionInput" placeholder="الخيار الثالث">
      <input class="optionInput" placeholder="الخيار الرابع">
    </div>

    <label>الإجابة الصحيحة</label>
    <select class="correctAnswer">
      <option value="0">الخيار الأول</option>
      <option value="1">الخيار الثاني</option>
      <option value="2">الخيار الثالث</option>
      <option value="3">الخيار الرابع</option>
    </select>

    <label>التغذية الراجعة</label>
    <textarea
      class="explanation"
      rows="2"
      placeholder="اكتبي تفسيرًا أو ملاحظة قصيرة للطالبة">
    </textarea>

    <button class="danger removeQuestion" type="button">
      حذف السؤال
    </button>
  `;

  box.querySelector(".removeQuestion").onclick = () => box.remove();

  document.getElementById("questions").appendChild(box);
}

function saveQuiz(){
  const questions =
    [...document.querySelectorAll(".qedit")]

    .map(el => ({
      text: el.querySelector(".qtext").value.trim(),

      options:
        [...el.querySelectorAll(".optionInput")]
        .map(x => x.value.trim()),

      correct:
        Number(el.querySelector(".correctAnswer").value),

      explanation:
        el.querySelector(".explanation").value.trim()
    }))

    .filter(q =>
      q.text &&
      q.options.filter(Boolean).length >= 2
    );

  const quiz = {
    title: val("quizTitle"),
    subject: val("quizSubject"),
    grade: val("quizGrade"),
    excellentAt: Number(val("excellentAt")) || 90,
    questions
  };

  if(!quiz.title){
    document.getElementById("saveMsg").innerHTML =
      '<p class="notice">اكتبي عنوان الاختبار.</p>';
    return;
  }

  if(!quiz.questions.length){
    document.getElementById("saveMsg").innerHTML =
      '<p class="notice">أضيفي سؤالًا واحدًا على الأقل.</p>';
    return;
  }

  const quizzes = getQuizzes();

  quizzes.push(quiz);

  saveQuizzes(quizzes);

  const link =
    location.origin +
    location.pathname +
    "?data=" +
    encodeQuiz(quiz);

  document.getElementById("saveMsg").innerHTML = `
    <div class="success">

      <strong>تم إنشاء الاختبار بنجاح.</strong>

      <p>هذا رابط الطالبات:</p>

      <textarea id="studentLink" rows="4">
${esc(link)}
      </textarea>

      <button class="primary" id="copyStudentLink">
        نسخ الرابط
      </button>

    </div>
  `;

  document.getElementById("copyStudentLink").onclick = () => {
    copyText(link);
  };
}

window.copyQuizLink = function(i){
  const quiz = getQuizzes()[i];

  const link =
    location.origin +
    location.pathname +
    "?data=" +
    encodeQuiz(quiz);

  copyText(link);
};

window.deleteQuiz = function(i){
  if(!confirm("هل تريدين حذف الاختبار؟")) return;

  const quizzes = getQuizzes();

  quizzes.splice(i,1);

  saveQuizzes(quizzes);

  teacherDashboard();
};

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    alert("تم نسخ رابط الطالبات");
  }catch{
    prompt("انسخي الرابط:",text);
  }
}

function loadStudentQuiz(quiz){

  app.innerHTML = `
    <section class="card">

      <h2>${esc(quiz.title)}</h2>

      <p class="muted">
        ${esc(quiz.subject || "")}
        ${quiz.grade ? "• " + esc(quiz.grade) : ""}
      </p>

      <label>اسم الطالبة</label>
      <input id="studentName" placeholder="الاسم الثلاثي">

      <label>الفصل</label>
      <input id="studentClass" placeholder="مثال: 2/1">

      <div id="studentQuestions">

      ${
        quiz.questions.map((q,i) => `

          <div class="question">

            <h3>
              ${i+1}. ${esc(q.text)}
            </h3>

            ${
              q.options.map((opt,j) =>

                opt
                ?
                `
                <label class="option">

                  <input
                    type="radio"
                    name="q${i}"
                    value="${j}"
                  >

                  <span>${esc(opt)}</span>

                </label>
                `
                :
                ""

              ).join("")
            }

          </div>

        `).join("")
      }

      </div>

      <button class="primary" id="submitQuizBtn">
        إرسال الإجابات وعرض التغذية الراجعة
      </button>

      <div id="studentMsg"></div>

    </section>
  `;

  document.getElementById("submitQuizBtn").onclick = () => {
    gradeQuiz(quiz);
  };
}

function gradeQuiz(quiz){

  const studentName = val("studentName");

  if(!studentName){

    document.getElementById("studentMsg").innerHTML =
      '<p class="notice">اكتبي اسمك أولًا.</p>';

    return;
  }

  const answers =
    quiz.questions.map((_,i) => {

      const selected =
        document.querySelector(
          `input[name="q${i}"]:checked`
        );

      return selected
        ? Number(selected.value)
        : -1;
    });

  let correctCount = 0;

  const feedback =
    quiz.questions.map((q,i) => {

      const ok =
        answers[i] === q.correct;

      if(ok) correctCount++;

      return {
        ok,
        question:q.text,
        correctText:q.options[q.correct],
        explanation:
          q.explanation ||
          "راجعي الإجابة الصحيحة."
      };
    });

  const percent =
    Math.round(
      correctCount /
      quiz.questions.length *
      100
    );

  let level = "";

  if(percent >= quiz.excellentAt){
    level = "متفوقة";
  }
  else if(percent >= 80){
    level = "متقنة";
  }
  else if(percent >= 60){
    level = "جيدة";
  }
  else{
    level = "تحتاج مراجعة";
  }

  app.innerHTML = `
    <section class="card">

      <h2>${esc(studentName)}</h2>

      <div class="score">
        ${percent}%
      </div>

      <h3>
        المستوى: ${level}
      </h3>

      <p>
        ${correctCount}
        إجابة صحيحة من أصل
        ${quiz.questions.length}
      </p>

      ${
        feedback.map((f,i) => `

          <div class="${f.ok ? "good" : "bad"}">

            <strong>
              ${i+1}.
              ${esc(f.question)}
            </strong>

            <p>
              ${
                f.ok
                ?
                "✓ إجابة صحيحة"
                :
                "✗ الإجابة الصحيحة: " +
                esc(f.correctText)
              }
            </p>

            <small>
              ${esc(f.explanation)}
            </small>

          </div>

        `).join("")
      }

      ${
        percent >= quiz.excellentAt
        ?
        `
        <div class="success">
          🌟 مبارك لكِ،
          حققتِ مستوى متفوقة
        </div>
        `
        :
        ""
      }

    </section>
  `;
}

try{

  if(quizData){

    loadStudentQuiz(
      decodeQuiz(quizData)
    );

  }else{

    home();

  }

}catch(err){

  app.innerHTML = `
    <section class="card">
      <p class="notice">
        تعذر فتح رابط الاختبار.
        اطلبِي من المعلمة إرسال الرابط من جديد.
      </p>
    </section>
  `;
}
</script>

</body>
</html>
